name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the one optional dependency (numpy, for the 22-player engine)
        run: python3 -m pip install -r requirements.txt
      - name: Unit and property tests
        run: python3 -I -m unittest discover -s tests -v
      - name: Specification hash and Season 1 tables
        run: python3 -I tools/validate.py data/season1 --doc docs/spec/DFL_Design_Document_Ed8.52.md
      - name: 30-season run (placeholder resolver), every season validated
        run: python3 -I tools/run_seasons.py --seasons 30 --seed 1 --out runs/ci
      - name: Ledger soak (3 league years, 48 clubs; the 100-year soak is run by hand)
        run: python3 -I tools/run_ledger_soak.py --years 3 --seed 1
      - name: Full-league soak (3 league years, real calendar and engine; the 100-year soak is run by hand)
        run: python3 -I tools/run_universe_soak.py --years 3 --seed 1
      - name: Spatial engine smoke (22-player plays, 20 games; band misses are informational, but a crash or an incomplete run fails the job; the full calibration is run by hand)
        run: python3 -I tools/calibrate_engine.py --games 20 --seed 1 --spatial --procs 2 --informational
